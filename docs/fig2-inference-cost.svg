<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" height="240" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif">
<text x="14" y="24" font-size="14" font-weight="600" fill="#8b949e">Eight times cheaper, and more sensitive</text>
<text x="14" y="42" font-size="11" fill="#8b949e">Mean Sens@95%spec over five representative cases. Bar is accuracy, label is cost.</text>
<line x1="190.0" y1="58" x2="190.0" y2="194" stroke="#8b949e" stroke-width="1" opacity="0.28"/>
<text x="190.0" y="212" font-size="10" fill="#8b949e" text-anchor="middle" font-family="ui-monospace,monospace">0.00</text>
<line x1="297.5" y1="58" x2="297.5" y2="194" stroke="#8b949e" stroke-width="1" opacity="0.28"/>
<text x="297.5" y="212" font-size="10" fill="#8b949e" text-anchor="middle" font-family="ui-monospace,monospace">0.25</text>
<line x1="405.0" y1="58" x2="405.0" y2="194" stroke="#8b949e" stroke-width="1" opacity="0.28"/>
<text x="405.0" y="212" font-size="10" fill="#8b949e" text-anchor="middle" font-family="ui-monospace,monospace">0.50</text>
<line x1="512.5" y1="58" x2="512.5" y2="194" stroke="#8b949e" stroke-width="1" opacity="0.28"/>
<text x="512.5" y="212" font-size="10" fill="#8b949e" text-anchor="middle" font-family="ui-monospace,monospace">0.75</text>
<line x1="620.0" y1="58" x2="620.0" y2="194" stroke="#8b949e" stroke-width="1" opacity="0.28"/>
<text x="620.0" y="212" font-size="10" fill="#8b949e" text-anchor="middle" font-family="ui-monospace,monospace">1.00</text>
<text x="182" y="76" font-size="12" fill="#8b949e" text-anchor="end" font-family="ui-monospace,monospace">Full baseline</text>
<rect x="190" y="62" width="230.9" height="19" fill="#7b3294" opacity="0.4"/>
<text x="427.9" y="77" font-size="12" fill="#8b949e" font-family="ui-monospace,monospace">0.537</text>
<text x="198" y="77" font-size="11" fill="#ffffff" font-family="ui-monospace,monospace">320 passes</text>
<text x="182" y="110" font-size="12" fill="#8b949e" text-anchor="end" font-family="ui-monospace,monospace">Coarse-only</text>
<rect x="190" y="96" width="376.2" height="19" fill="#b5308a" opacity="1.0"/>
<text x="573.2" y="111" font-size="12" fill="#8b949e" font-family="ui-monospace,monospace">0.875</text>
<text x="198" y="111" font-size="11" fill="#ffffff" font-family="ui-monospace,monospace">40 passes</text>
<text x="182" y="144" font-size="12" fill="#8b949e" text-anchor="end" font-family="ui-monospace,monospace">3A fixed ROI</text>
<rect x="190" y="130" width="291.1" height="19" fill="#7b3294" opacity="0.4"/>
<text x="488.1" y="145" font-size="12" fill="#8b949e" font-family="ui-monospace,monospace">0.677</text>
<text x="198" y="145" font-size="11" fill="#ffffff" font-family="ui-monospace,monospace">160 passes</text>
<text x="182" y="178" font-size="12" fill="#8b949e" text-anchor="end" font-family="ui-monospace,monospace">3B zoom-in</text>
<rect x="190" y="164" width="354.8" height="19" fill="#7b3294" opacity="0.4"/>
<text x="551.8" y="179" font-size="12" fill="#8b949e" font-family="ui-monospace,monospace">0.825</text>
<text x="198" y="179" font-size="11" fill="#ffffff" font-family="ui-monospace,monospace">475 passes</text>
<text x="14" y="232" font-size="10" fill="#8b949e">n = 5, so the ordering is indicative rather than a benchmark. Per-case numbers are in the README table.</text>
</svg>